name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint + type + test) + db schema tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noticedesk
          POSTGRES_PASSWORD: noticedesk
          POSTGRES_DB: noticedesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noticedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: apps/api
        run: ruff check .
      - name: Mypy
        working-directory: apps/api
        run: mypy app
      - name: Apply DB migrations + run schema tests
        env:
          PGPASSWORD: noticedesk
          DATABASE_URL: postgres://noticedesk:noticedesk@localhost:5432/noticedesk_test
        run: bash packages/db/tests/run_all.sh
      - name: Pytest
        working-directory: apps/api
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: dev
          DATABASE_URL: postgresql+asyncpg://noticedesk:noticedesk@localhost:5432/noticedesk_test
        run: pytest

  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspaces
        run: npm install --no-audit --no-fund --workspaces --include-workspace-root
      - name: Typecheck shared
        run: npm --workspace @noticedesk/shared run typecheck
      - name: Typecheck web
        run: npm --workspace @noticedesk/web run typecheck
      - name: Lint web
        run: npm --workspace @noticedesk/web run lint
      - name: Build web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npm --workspace @noticedesk/web run build

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
