[project]
name = "noticedesk-api"
version = "0.1.0"
description = "NoticeDesk API — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "anyio>=4.3.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.0.0",
    "structlog>=24.1.0",
    "boto3>=1.34.0",
    "temporalio>=1.6.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Real LLM providers — installed only when you flip LLM_PROVIDER_PRIMARY
# away from the stub. Keeps the default install slim for CI / contributors.
anthropic = [
    "anthropic>=0.34.0",
]
openai = [
    "openai>=1.40.0",
]
# Real OCR providers — same pattern.
google_doc_ai = [
    "google-cloud-documentai>=2.27.0",
]
azure_doc_intel = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-core>=1.30.0",
]
# Convenience: pip install -e ".[live]" pulls everything you need for a
# real partner demo (Anthropic + Google Doc AI). IndianKanoon's token-based
# adapter has no extra SDK so it isn't here.
live = [
    "anthropic>=0.34.0",
    "google-cloud-documentai>=2.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
